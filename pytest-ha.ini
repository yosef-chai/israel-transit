[pytest]
# Home Assistant level tests. These need the real integration importable and a
# Home Assistant test harness -- pytest-homeassistant, or
# pytest-homeassistant-custom-component for releases before it existed (see
# tests/ha/common.py) -- so they run separately from the dependency-free
# parsing tests in pytest.ini.
testpaths = tests/ha
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# win_posix_shim stubs the two POSIX modules Home Assistant imports on the way
# in, so this suite runs on Windows too; it is a no-op everywhere else. It has
# to load with -p, before the harness's own entry-point plugin.
addopts = -p no:randomly -p win_posix_shim
