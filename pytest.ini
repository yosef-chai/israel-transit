[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# These tests exercise pure parsing with faked HTTP clients, so none of the
# heavyweight async plugins are wanted. pytest-homeassistant-custom-component
# in particular installs autouse fixtures that demand a full Home Assistant
# test harness, and pytest-socket blocks the socketpair asyncio needs to build
# an event loop on Windows.
# tests/ha needs the opposite setup and runs from pytest-ha.ini.
addopts = -p no:socket -p no:homeassistant -p no:aiohttp --ignore=tests/ha
filterwarnings =
    ignore::DeprecationWarning
