name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # בתגים רץ מתוך release.yml, לפני יצירת הגרסה
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      # Typed against the minimum version: from 2026.9 core annotates schemas
      # with probatio, which 2026.7 doesn't have, so it can't be imported here.
      - run: pip install ruff mypy pytest-homeassistant-custom-component==0.13.344
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: mypy

  parsing:
    name: Parsing and GTFS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install pytest pytest-asyncio aiohttp voluptuous
      - run: python -m pytest -q

  homeassistant:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # הגרסה המינימלית מ-hacs.json; מעדכנים יחד איתה
          - name: Home Assistant 2026.7.0
            harness: pytest-homeassistant-custom-component==0.13.344
          - name: Home Assistant latest
            harness: pytest-homeassistant-custom-component
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install "${{ matrix.harness }}"
      # python -m puts the repository on sys.path, where -p finds win_posix_shim
      - run: python -m pytest -c pytest-ha.ini -q --cov=custom_components.israel_transit --cov-report=term-missing

  card:
    name: Card bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The committed bundle matches the sources
        run: git diff --exit-code -- custom_components/israel_transit/www/
